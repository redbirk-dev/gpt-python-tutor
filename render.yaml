services:
  - type: web
    name: gpt-python-tutor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///python_tutor.db
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py 