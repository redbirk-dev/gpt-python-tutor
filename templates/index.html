<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GPT Python Tutor</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; }
    textarea { width: 100%; height: 100px; }
    button { margin-top: 10px; }
    #response { white-space: pre-wrap; margin-top: 20px; background: #f0f0f0; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Ask GPT About Python</h1>
  <textarea id="prompt" placeholder="Ask a Python question..."></textarea><br>
  <button onclick="askGPT()">Ask</button>
  <div id="response"></div>

  <script>
    async function askGPT() {
      const prompt = document.getElementById('prompt').value;
      const res = await fetch('/api/gpt-python', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      document.getElementById('response').textContent = data.response;
    }
  </script>
</body>
</html>
