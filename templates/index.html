<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Python Tutor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans min-h-screen flex items-center justify-center">
  <div class="w-full max-w-2xl bg-gray-900 p-6 rounded-xl shadow-xl space-y-6">
    <h1 class="text-4xl font-bold text-center text-blue-400">GPT Python Tutor</h1>

    <textarea id="prompt" placeholder="Ask a Python question..." class="w-full p-4 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="5"></textarea>

    <div class="flex flex-col sm:flex-row gap-3">
      <button onclick="askGPT()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded text-lg font-semibold">
        Ask GPT
      </button>
      <button onclick="startLesson()" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 px-4 rounded text-lg font-semibold">
        Teach Me Python
      </button>
    </div>

    <div id="response" class="whitespace-pre-wrap bg-gray-800 text-sm p-4 rounded border border-gray-700 font-mono min-h-[120px]"></div>
  </div>

  <script>
    async function askGPT() {
      const prompt = document.getElementById('prompt').value;
      const res = await fetch('/api/gpt-python', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      document.getElementById('response').textContent = data.response;
    }

    async function startLesson() {
      const res = await fetch('/api/gpt-python', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: "Create a beginner-friendly multiple choice Python question with 4 options. Label the correct answer clearly. Format it nicely."
        })
      });
      const data = await res.json();
      document.getElementById('response').textContent = data.response;
    }
  </script>
</body>
</html>
