<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Python Tutor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css">
  <style>
    pre[class*="language-"] {
      position: relative;
      padding-left: 3.5em;
      counter-reset: linenumber;
      white-space: pre-wrap; /* Allow wrapping of text */
      word-wrap: break-word; /* Allow wrapping of long words */
      max-width: 100%;
      overflow-wrap: break-word;
    }

    pre[class*="language-"] code {
      display: block;
      counter-increment: linenumber;
    }

    pre[class*="language-"] code::before {
      content: counter(linenumber);
      display: inline-block;
      width: 2.5em;
      margin-left: -3.5em;
      padding-right: 0.5em;
      text-align: right;
      opacity: 0.3;
    }

    /* Adjust font size for better readability */
    #response {
      font-size: 14px;
      word-wrap: break-word;
      white-space: normal;
      overflow-wrap: break-word;
    }
  </style>
</head>
<body class="bg-black text-white font-sans min-h-screen flex items-start justify-center">
  <div class="flex w-full max-w-7xl mt-10">
    <!-- Sidebar Lessons -->
    <aside class="w-1/4 bg-gray-800 p-4 rounded-xl mr-4 space-y-2 text-sm">
      <h2 class="text-xl font-bold text-blue-400 mb-4">📘 Python Lessons</h2>
      <ul class="space-y-2">
        <li><a href="#" onclick="showLesson('vars')" class="hover:underline text-blue-200">Variables & Data Types</a></li>
        <li><a href="#" onclick="showLesson('control')" class="hover:underline text-blue-200">If, Else & Loops</a></li>
        <li><a href="#" onclick="showLesson('functions')" class="hover:underline text-blue-200">Functions & Scope</a></li>
        <li><a href="#" onclick="showLesson('lists')" class="hover:underline text-blue-200">Lists & Dictionaries</a></li>
        <li><a href="#" onclick="showLesson('oop')" class="hover:underline text-blue-200">Intro to OOP</a></li>
      </ul>
    </aside>

    <!-- Main App Area -->
    <div class="flex-1 bg-gray-900 p-6 rounded-xl shadow-xl space-y-6">
      <h1 class="text-4xl font-bold text-center text-blue-400">GPT Python Tutor</h1>
      <div class="text-center text-green-400 text-lg">
        Score: <span id="score">0</span> | Attempts: <span id="attempts">0</span> | Streak: <span id="streak">0</span>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 items-center">
        <select id="difficulty" class="bg-gray-800 border border-gray-700 text-white rounded px-4 py-3 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-green-500">
          <option value="easy">🟢 Easy</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="hard">🔴 Hard</option>
        </select>

        <button id="startLessonBtn" type="button" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 px-4 rounded text-lg font-semibold">
          Teach Me Python
        </button>
        <details class="w-full">
          <summary class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded text-lg font-semibold text-center" onclick="event.stopPropagation()">Ask GPT a Question</summary>
          <div class="mt-3 space-y-2">
            <textarea id="prompt" placeholder="Ask a Python question..." class="w-full p-4 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm" rows="4"></textarea>
            <button id="askGPTBtn" type="button" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">Ask</button>
          </div>
        </details>
      </div>

      <pre class="whitespace-pre-wrap bg-gray-800 text-sm p-4 rounded border border-gray-700 font-mono min-h-[120px] transition-all duration-300 ease-in-out overflow-x-auto"><code id="response" class="language-python"></code></pre>

      <div id="choices" class="space-y-2 hidden">
        <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
        <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
        <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
        <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
      </div>

      <button id="nextBtn" class="hidden w-full bg-purple-600 hover:bg-purple-700 text-white py-3 px-4 rounded text-lg font-semibold">
        Next Question
      </button>

      <div id="lessonContent" class="bg-gray-800 p-4 mt-4 rounded text-sm hidden"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>
  <script>
    function renderCodeBlock(code) {
      return Prism.highlight(code, Prism.languages.python, 'python')
        .split('\n')
        .map(line => `<span class="line">${line}</span>`)
        .join('\n');
    }

    function showLesson(topic) {
      const lessons = {
        vars: "**Variables & Data Types**\n\n```python\nx = 10\nname = 'Joe'\nis_ready = True\n```",
        control: "**If, Else & Loops**\n\n```python\nif x > 5:\n    print('Big')\nelse:\n    print('Small')\n\nfor i in range(3):\n    print(i)\n```",
        functions: "**Functions & Scope**\n\n```python\ndef greet(name):\n    return f\"Hello {name}\"\n\nprint(greet('Joe'))\n```",
        lists: "**Lists & Dictionaries**\n\n```python\nnums = [1, 2, 3]\ndata = {'name': 'Joe', 'age': 17}\n```",
        oop: "**Intro to OOP**\n\n```python\nclass Dog:\n    def __init__(self, name):\n        self.name = name\n\n    def bark(self):\n        print(self.name + ' says woof!')\n```"
      };
      const lessonContent = document.getElementById('lessonContent');
      lessonContent.innerHTML = `<div class='whitespace-pre-wrap'>${marked.parse(lessons[topic])}</div>`;
      lessonContent.classList.remove('hidden');
      lessonContent.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function askGPT() {
      const prompt = document.getElementById('prompt').value;
      const res = await fetch('/api/gpt-python', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();

      const responseText = data.response.trim();

      // Check if the response is a multiple-choice question
      if (responseText.startsWith("{")) {
        const parsed = JSON.parse(responseText);
        const question = parsed.question;
        const options = parsed.options.join('<br>');
        const correctAnswer = parsed.answer;

        // Format the response with multiple choices
        document.getElementById('response').innerHTML = `
          <strong>${question}</strong><br>
          ${options}<br>
          <strong>Correct Answer:</strong> ${correctAnswer}
        `;
      } else {
        // Handle free-form responses
        document.getElementById('response').innerHTML = renderCodeBlock(responseText);
      }

      document.getElementById('choices').classList.add('hidden');
      document.getElementById('nextBtn').classList.add('hidden');
    }

    async function startLesson() {
      let score = parseInt(localStorage.getItem('score')) || 0;
      let attempts = parseInt(localStorage.getItem('attempts')) || 0;
      let streak = parseInt(localStorage.getItem('streak')) || 0;
      let hasGuessedWrong = false;
      const responseEl = document.getElementById('response');
      const choicesEl = document.getElementById('choices');
      const nextBtn = document.getElementById('nextBtn');
      const buttons = document.getElementsByClassName('choice-btn');
      let correctAnswer = '';
      const difficulty = document.getElementById('difficulty').value;

      const promptText = `You are a Python tutor. Generate a multiple choice question that includes real Python code that must be evaluated. Return ONLY raw JSON: {"question": "...", "options": ["A. ...", "B. ...", "C. ...", "D. ..."], "answer": "..."} (Difficulty: ${difficulty.toUpperCase()})`;

      const res = await fetch("/api/gpt-python", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: promptText })
      });
      const data = await res.json();

      try {
        const parsed = JSON.parse(data.response);
        responseEl.innerHTML = renderCodeBlock(parsed.question);
        correctAnswer = parsed.answer;
        Array.from(buttons).forEach((btn, i) => {
          btn.textContent = parsed.options[i];
          btn.disabled = false;
          btn.onclick = () => {
            attempts++;
            if (btn.textContent === correctAnswer) {
              if (!hasGuessedWrong) {
                score++;
                streak++;
              } else {
                streak = 0;
              }
              responseEl.innerHTML = renderCodeBlock("✅ Correct!\n\n" + parsed.question);
              nextBtn.classList.remove("hidden");
              Array.from(buttons).forEach(b => b.disabled = true);
            } else {
              hasGuessedWrong = true;
              streak = 0;
              responseEl.innerHTML = renderCodeBlock("❌ Incorrect. Try again.\n\n" + parsed.question);
            }
            localStorage.setItem('score', score);
            localStorage.setItem('attempts', attempts);
            localStorage.setItem('streak', streak);
            document.getElementById('score').textContent = score;
            document.getElementById('attempts').textContent = attempts;
            document.getElementById('streak').textContent = streak;
          };
        });
        choicesEl.classList.remove("hidden");
      } catch {
        responseEl.textContent = "⚠️ Could not parse GPT response as JSON.";
        choicesEl.classList.add("hidden");
      }
    }

    window.addEventListener("load", () => {
      document.getElementById('startLessonBtn').addEventListener('click', startLesson);
      document.getElementById('askGPTBtn').addEventListener('click', askGPT);
    });
  </script>
</body>
</html>
