    pre[class*="language-"] {

      overflow-x: auto;

      content: counter(linenumber);

      padding-right: 0.5em;
      text-align: right;

  <script>
    function renderCodeBlock(code) {
      return Prism.highlight(code, Prism.languages.python, 'python')
        .split('\n')
        .map(line => `<span class="line">${line}</span>`)
        .join('\n');
    }

    function formatQuestionResponse(response) {
      // Parse the response to extract the question, options, and answer
      const parsedData = JSON.parse(response);

      let questionText = parsedData.question || "";
      let options = parsedData.options || [];
      let answer = parsedData.answer || "";

      // Format the question and options properly
      const formattedOptions = options.map((opt, index) => {
        return `<button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600" data-answer="${opt}" onclick="handleOptionClick('${opt}')">${opt}</button>`;
      }).join("");

      return {
        questionText: questionText,
        optionsHtml: formattedOptions,
        correctAnswer: answer
      };
    }

    function handleOptionClick(option) {
      // Handle the option click logic here
      const selectedAnswer = option;
      const correctAnswer = document.getElementById("correctAnswer").textContent;

      if (selectedAnswer === correctAnswer) {
        alert("✅ Correct!");
      } else {
        alert("❌ Incorrect, try again.");
      }
    }

    async function askGPT() {
      const prompt = document.getElementById('prompt').value;
      if (!prompt.trim()) {
        alert('Please enter a question first!');
        return;
      }

      const res = await fetch('/api/gpt-python', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });

      const data = await res.json();
      const response = data.response;

      // Check if the response is a quiz question (JSON format)
      try {
        const parsedData = JSON.parse(response);
        if (parsedData.question && parsedData.options && parsedData.answer) {
          // Handle quiz question
          const formattedData = formatQuestionResponse(response);
          
          // Render the formatted question and options in the page
          const questionContainer = document.getElementById('response');
          questionContainer.innerHTML = renderCodeBlock(formattedData.questionText);

          const optionsContainer = document.getElementById('choices');
          optionsContainer.innerHTML = formattedData.optionsHtml;
          optionsContainer.classList.remove('hidden');

          // Store the correct answer for validation
          const correctAnswerContainer = document.getElementById('correctAnswer');
          correctAnswerContainer.textContent = formattedData.correctAnswer;
          correctAnswerContainer.classList.remove('hidden');

          document.getElementById('nextBtn').classList.add('hidden');
        }
      } catch (e) {
        // Handle general question response
        const responseContainer = document.getElementById('response');
        responseContainer.innerHTML = renderCodeBlock(response);
        
        // Hide quiz-related elements
        document.getElementById('choices').classList.add('hidden');
        document.getElementById('correctAnswer').classList.add('hidden');
        document.getElementById('nextBtn').classList.add('hidden');
      }
    }

    async function startLesson() {
      let score = parseInt(localStorage.getItem('score')) || 0;
      let attempts = parseInt(localStorage.getItem('attempts')) || 0;
      let streak = parseInt(localStorage.getItem('streak')) || 0;
      let hasGuessedWrong = false;
      const responseEl = document.getElementById('response');
      const choicesEl = document.getElementById('choices');
      const nextBtn = document.getElementById('nextBtn');
      const buttons = document.getElementsByClassName('choice-btn');
      let correctAnswer = '';
      const difficulty = document.getElementById('difficulty').value;

      const promptText = `You are a Python tutor. Generate a multiple choice question that includes real Python code that must be evaluated. Return ONLY raw JSON: {"question": "...", "options": ["A. ...", "B. ...", "C. ...", "D. ..."], "answer": "..."} (Difficulty: ${difficulty.toUpperCase()})`;

      const res = await fetch("/api/gpt-python", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: promptText })
      });
      const data = await res.json();

      try {
        const parsed = JSON.parse(data.response);
        responseEl.innerHTML = renderCodeBlock(parsed.question);
        correctAnswer = parsed.answer;
        Array.from(buttons).forEach((btn, i) => {
          btn.textContent = parsed.options[i];
          btn.disabled = false;
          btn.onclick = () => {
            attempts++;
            if (btn.textContent === correctAnswer) {
              if (!hasGuessedWrong) {
                score++;
                streak++;
              } else {
                streak = 0;
              }
              responseEl.innerHTML = renderCodeBlock("✅ Correct!\n\n" + parsed.question);
              nextBtn.classList.remove("hidden");
              Array.from(buttons).forEach(b => b.disabled = true);
            } else {
              hasGuessedWrong = true;
              streak = 0;
              responseEl.innerHTML = renderCodeBlock("❌ Incorrect. Try again.\n\n" + parsed.question);
            }
            localStorage.setItem('score', score);
            localStorage.setItem('attempts', attempts);
            localStorage.setItem('streak', streak);
            document.getElementById('score').textContent = score;
            document.getElementById('attempts').textContent = attempts;
            document.getElementById('streak').textContent = streak;
          };
        });
        choicesEl.classList.remove("hidden");
      } catch {
        responseEl.textContent = "⚠️ Could not parse GPT response as JSON.";
        choicesEl.classList.add("hidden");
      }
    }

    window.addEventListener("load", () => {
      document.getElementById('startLessonBtn').addEventListener('click', startLesson);
      document.getElementById('askGPTBtn').addEventListener('click', askGPT);
    });

# Variables & Data Types in Python

## Basic Variables
Variables in Python are containers for storing data values. Unlike other programming languages, Python doesn't require explicit type declaration.

\`\`\`python
# Numbers
age = 25          # Integer
height = 1.75     # Float
complex_num = 3 + 4j  # Complex number

# Strings
name = "Python"   # String with double quotes
message = 'Hello' # String with single quotes
multi_line = """
This is a
multi-line
string
"""

# Booleans
is_active = True
is_finished = False

# None type
empty_value = None
\`\`\`

## Type Conversion
Python allows you to convert between different data types:

\`\`\`python
# Converting between types
num_str = "123"
num_int = int(num_str)    # String to integer
num_float = float(num_str)  # String to float
str_num = str(123)        # Integer to string
\`\`\`

## Type Checking
You can check the type of a variable using the \`type()\` function:

\`\`\`python
x = 42
print(type(x))  # Output: <class 'int'>

y = "Hello"
print(type(y))  # Output: <class 'str'>
\`\`\`

## Best Practices
1. Use meaningful variable names
2. Follow Python naming conventions (snake_case)
3. Initialize variables before using them
4. Use appropriate data types for your needs

# Control Flow in Python

## Conditional Statements
Python uses indentation to define code blocks in if-else statements.

\`\`\`python
# Basic if-else
age = 18
if age >= 18:
    print("You are an adult")
else:
    print("You are a minor")

# if-elif-else
score = 85
if score >= 90:
    grade = 'A'
elif score >= 80:
    grade = 'B'
elif score >= 70:
    grade = 'C'
else:
    grade = 'D'

# Nested if statements

has_ticket = True
if age >= 18:
    if has_ticket:
        print("You can enter the venue")
    else:
        print("Please purchase a ticket")
else:
    print("You must be 18 or older")
\`\`\`

## Loops

### For Loops
Used for iterating over a sequence (list, tuple, string, etc.)

\`\`\`python
# Basic for loop
for i in range(5):
    print(i)  # Prints 0 to 4

# Loop with start, stop, and step
for i in range(2, 10, 2):
    print(i)  # Prints 2, 4, 6, 8

# Loop through a list
fruits = ['apple', 'banana', 'cherry']
for fruit in fruits:
    print(fruit)

# Loop with enumerate
for index, fruit in enumerate(fruits):
    print(f"{index}: {fruit}")
\`\`\`

### While Loops
Repeats as long as a condition is true

\`\`\`python
# Basic while loop
count = 0
while count < 5:
    print(count)
    count += 1

# Break statement
while True:
    user_input = input("Enter 'q' to quit: ")
    if user_input == 'q':
        break
    print("You entered:", user_input)

# Continue statement
for i in range(10):
    if i % 2 == 0:
        continue  # Skip even numbers
    print(i)  # Prints only odd numbers
\`\`\`

## Best Practices
1. Use meaningful conditions
2. Keep loops simple and readable
3. Avoid infinite loops
4. Use appropriate loop types for your needs
5. Consider using list comprehensions for simple iterations

# Functions in Python

## Function Definition
Functions are defined using the \`def\` keyword:

\`\`\`python
# Basic function
def greet():
    print("Hello, World!")

# Function with parameters
def greet_person(name):
    print(f"Hello, {name}!")

# Function with default parameters
def greet_with_title(name, title="Mr."):
    print(f"Hello, {title} {name}!")

# Function with multiple parameters
def calculate_total(price, quantity, discount=0):
    total = price * quantity * (1 - discount)
    return total
\`\`\`

## Return Values
Functions can return single or multiple values:

\`\`\`python
# Single return value
def square(number):
    return number ** 2

# Multiple return values
def get_coordinates():
    x = 10
    y = 20
    return x, y  # Returns a tuple

# Using return values
result = square(5)  # result = 25
x, y = get_coordinates()  # x = 10, y = 20
\`\`\`

## Variable Scope

### Local Scope
Variables defined inside a function are local to that function:

\`\`\`python
def my_function():
    local_var = 10
    print(local_var)  # Works
    return local_var

# print(local_var)  # Error: local_var is not defined
\`\`\`

### Global Scope
Variables defined outside functions are global:

\`\`\`python
global_var = 100

def access_global():
    print(global_var)  # Can access global variable

def modify_global():
    global global_var  # Declare we want to modify global variable
    global_var = 200   # Modify global variable
\`\`\`

## Lambda Functions
Anonymous functions defined with the \`lambda\` keyword:

\`\`\`python
# Basic lambda
square = lambda x: x ** 2

# Lambda with multiple arguments
add = lambda x, y: x + y

# Using lambda with built-in functions
numbers = [1, 2, 3, 4, 5]
squared = list(map(lambda x: x ** 2, numbers))
\`\`\`

## Best Practices
1. Use descriptive function names
2. Keep functions focused on a single task
3. Use type hints for better code documentation
4. Document functions with docstrings
5. Avoid modifying global variables when possible
6. Use appropriate parameter defaults

# Lists and Dictionaries in Python

## Lists
Lists are ordered, mutable collections of items:

\`\`\`python
# Creating lists
numbers = [1, 2, 3, 4, 5]
mixed_list = [1, "hello", 3.14, True]
empty_list = []

# List operations
numbers.append(6)        # Add to end
numbers.insert(0, 0)     # Insert at index
numbers.remove(3)        # Remove value
popped = numbers.pop()   # Remove and return last item
length = len(numbers)    # Get length

# List slicing
subset = numbers[1:4]    # Get items from index 1 to 3
reversed_list = numbers[::-1]  # Reverse list

# List comprehension
squares = [x**2 for x in range(10)]
even_numbers = [x for x in range(10) if x % 2 == 0]
\`\`\`

## Dictionaries
Dictionaries are unordered collections of key-value pairs:

\`\`\`python
# Creating dictionaries
person = {
    "name": "John",
    "age": 30,
    "city": "New York"
}
empty_dict = {}

# Dictionary operations
person["email"] = "john@example.com"  # Add/update key
del person["age"]                     # Remove key
value = person.get("name")            # Safe access
keys = person.keys()                  # Get all keys
values = person.values()              # Get all values

# Nested dictionaries
company = {
    "name": "Tech Corp",
    "employees": {
        "john": {"role": "developer", "years": 5},
        "alice": {"role": "manager", "years": 7}
    }
}

# Dictionary comprehension
squares = {x: x**2 for x in range(5)}
\`\`\`

## Common Operations

### List Operations
\`\`\`python
# Sorting
numbers.sort()                    # In-place sort
sorted_numbers = sorted(numbers)  # New sorted list

# Finding elements
index = numbers.index(4)          # Get index of value
count = numbers.count(2)          # Count occurrences

# Combining lists
combined = numbers + [6, 7, 8]    # Concatenate lists
extended = numbers.extend([6, 7, 8])  # Extend in-place
\`\`\`

### Dictionary Operations
\`\`\`python
# Merging dictionaries
dict1 = {"a": 1, "b": 2}
dict2 = {"c": 3, "d": 4}
merged = {**dict1, **dict2}  # Python 3.5+

# Dictionary methods
items = person.items()        # Get key-value pairs
person.clear()               # Remove all items
person.copy()                # Create a copy
\`\`\`

## Best Practices
1. Use appropriate data structures for your needs
2. Consider performance implications of operations
3. Use list/dict comprehensions for cleaner code
4. Handle missing keys safely in dictionaries
5. Use meaningful key names
6. Consider using collections module for specialized containers

# Object-Oriented Programming in Python

## Classes and Objects
Classes are blueprints for creating objects:

\`\`\`python
# Basic class definition
class Person:
    def __init__(self, name, age):
        self.name = name
        self.age = age
    
    def greet(self):
        return f"Hello, my name is {self.name}"

# Creating objects
person1 = Person("John", 30)
person2 = Person("Alice", 25)

# Accessing attributes and methods
print(person1.name)      # Access attribute
print(person1.greet())   # Call method
\`\`\`

## Inheritance
Classes can inherit from other classes:

\`\`\`python
class Employee(Person):
    def __init__(self, name, age, employee_id):
        super().__init__(name, age)
        self.employee_id = employee_id
    
    def work(self):
        return f"{self.name} is working"

# Using inheritance
employee = Employee("Bob", 35, "E123")
print(employee.greet())  # Inherited method
print(employee.work())   # New method
\`\`\`

## Encapsulation
Using access modifiers to control attribute access:

\`\`\`python
class BankAccount:
    def __init__(self, owner, balance):
        self._owner = owner      # Protected attribute
        self.__balance = balance  # Private attribute
    
    def deposit(self, amount):
        if amount > 0:
            self.__balance += amount
            return True
        return False
    
    def get_balance(self):
        return self.__balance

# Using encapsulation
account = BankAccount("John", 1000)
account.deposit(500)
print(account.get_balance())  # 1500
\`\`\`

## Polymorphism
Different classes can implement the same method differently:

\`\`\`python
class Animal:
    def make_sound(self):
        pass

class Dog(Animal):
    def make_sound(self):
        return "Woof!"

class Cat(Animal):
    def make_sound(self):
        return "Meow!"

# Using polymorphism
animals = [Dog(), Cat()]
for animal in animals:
    print(animal.make_sound())
\`\`\`

## Class Methods and Static Methods

\`\`\`python
class MathOperations:
    @staticmethod
    def add(x, y):
        return x + y
    
    @classmethod
    def create_from_string(cls, string):
        x, y = map(int, string.split(','))
        return cls(x, y)

# Using static and class methods
result = MathOperations.add(5, 3)
obj = MathOperations.create_from_string("5,3")
\`\`\`

## Best Practices
1. Use meaningful class and method names
2. Follow the Single Responsibility Principle
3. Use inheritance appropriately
4. Implement proper encapsulation
5. Document classes and methods
6. Use type hints for better code documentation
7. Consider using dataclasses for simple data containers
`
