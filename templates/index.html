<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Python Tutor</title>
  <script src="https://cdn.tailwindcss.com">document.querySelectorAll('[onclick]').forEach(el => {
    if (el.getAttribute('onclick') === 'startLesson()') el.onclick = window.startLesson;
    if (el.getAttribute('onclick') === 'askGPT()') el.onclick = window.askGPT;
  });
</script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css">
  <style>
    pre[class*="language-"] {
      position: relative;
      padding-left: 3.5em;
      counter-reset: linenumber;
    }
    pre[class*="language-"] code > span.line {
      display: block;
      counter-increment: linenumber;
    }
    pre[class*="language-"] code > span.line::before {
      content: counter(linenumber);
      display: inline-block;
      width: 2.5em;
      margin-left: -3.5em;
      padding-right: 0.5em;
      text-align: right;
      opacity: 0.3;
    }
  </style>
</head>
<body class="bg-black text-white font-sans min-h-screen flex items-start justify-center">
  <div class="flex w-full max-w-7xl mt-10">
    <!-- Sidebar Lessons -->
    <aside class="w-1/4 bg-gray-800 p-4 rounded-xl mr-4 space-y-2 text-sm">
      <h2 class="text-xl font-bold text-blue-400 mb-4">📘 Python Lessons</h2>
      <ul class="space-y-2">
        <li><a href="#" onclick="showLesson('vars')" class="hover:underline text-blue-200">Variables & Data Types</a></li>
        <li><a href="#" onclick="showLesson('control')" class="hover:underline text-blue-200">If, Else & Loops</a></li>
        <li><a href="#" onclick="showLesson('functions')" class="hover:underline text-blue-200">Functions & Scope</a></li>
        <li><a href="#" onclick="showLesson('lists')" class="hover:underline text-blue-200">Lists & Dictionaries</a></li>
        <li><a href="#" onclick="showLesson('oop')" class="hover:underline text-blue-200">Intro to OOP</a></li>
      </ul>
    </aside>

    <!-- Main App Area -->
    <div class="flex-1 bg-gray-900 p-6 rounded-xl shadow-xl space-y-6">
      <h1 class="text-4xl font-bold text-center text-blue-400">GPT Python Tutor</h1>
      <div class="text-center text-green-400 text-lg">
        Score: <span id="score">0</span> | Attempts: <span id="attempts">0</span> | Streak: <span id="streak">0</span>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 items-center">
        <select id="difficulty" class="bg-gray-800 border border-gray-700 text-white rounded px-4 py-3 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-green-500">
  <option value="easy">🟢 Easy</option>
  <option value="medium" selected>🟡 Medium</option>
  <option value="hard">🔴 Hard</option>
</select>

<button id="startLessonBtn" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 px-4 rounded text-lg font-semibold">
          Teach Me Python
        </button>
        <details class="w-full">
          <summary class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded text-lg font-semibold text-center" onclick="event.stopPropagation()">Ask GPT a Question</summary>
          <div class="mt-3 space-y-2">
            <textarea id="prompt" placeholder="Ask a Python question..." class="w-full p-4 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm" rows="4"></textarea>
            <button id="askGPTBtn" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">Ask</button>
          </div>
        </details>
      </div>

      <pre class="whitespace-pre-wrap bg-gray-800 text-sm p-4 rounded border border-gray-700 font-mono min-h-[120px] transition-all duration-300 ease-in-out overflow-x-auto"><code id="response" class="language-python"></code></pre>

      <div id="choices" class="space-y-2 hidden">
        <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
        <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
        <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
        <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
      </div>

      <button id="nextBtn" id="startLessonBtn" class="hidden w-full bg-purple-600 hover:bg-purple-700 text-white py-3 px-4 rounded text-lg font-semibold">
        Next Question
      </button>

      <div id="lessonContent" class="bg-gray-800 p-4 mt-4 rounded text-sm hidden"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>
  <script>
    function renderCodeBlock(code) {
      return Prism.highlight(code, Prism.languages.python, 'python')
        .split('\n')
        .map(line => `<span class="line">${line}</span>`)
        .join('\n');
    }

    window.addEventListener("load", () => {
      document.getElementById('startLessonBtn').addEventListener('click', window.startLesson);
      document.getElementById('askGPTBtn').addEventListener('click', window.askGPT);
      let score = parseInt(localStorage.getItem('score')) || 0;
      let attempts = parseInt(localStorage.getItem('attempts')) || 0;
      let streak = parseInt(localStorage.getItem('streak')) || 0;
      let hasGuessedWrong = false;
      const scoreEl = document.getElementById('score');
      const attemptsEl = document.getElementById('attempts');
      const streakEl = document.getElementById('streak');
      const responseEl = document.getElementById('response');
      const choicesEl = document.getElementById('choices');
      const nextBtn = document.getElementById('nextBtn');
      const lessonContent = document.getElementById('lessonContent');
      const buttons = document.getElementsByClassName('choice-btn');
      let correctAnswer = '';

      function updateStats() {
        scoreEl.textContent = score;
        attemptsEl.textContent = attempts;
        streakEl.textContent = streak;
        localStorage.setItem('score', score);
        localStorage.setItem('attempts', attempts);
        localStorage.setItem('streak', streak);
      }

      window.showLesson = function(topic) {
        const lessons = {
          vars: "**Variables & Data Types**\n\nPython variables store data. Example:\n```python\nx = 10\nname = 'Rudra'\nis_ready = True\n```\n\nCommon data types: int, float, str, bool.",
          control: "**If, Else & Loops**\n\nConditional logic and repetition:\n```python\nif x > 5:\n    print('Big')\nelse:\n    print('Small')\n\nfor i in range(3):\n    print(i)\n```",
          functions: "**Functions & Scope**\n\nFunctions let you reuse logic:\n```python\ndef greet(name):\n    return f\"Hello {name}\"\n\nprint(greet('Rudra'))\n```",
          lists: "**Lists & Dictionaries**\n\nLists are ordered, dictionaries are key-value:\n```python\nnums = [1, 2, 3]\ndata = {'name': 'Rudra', 'age': 17}\n```",
          oop: "**Intro to OOP**\n\nOOP uses classes to model data:\n```python\nclass Dog:\n    def __init__(self, name):\n        self.name = name\n\n    def bark(self):\n        print(self.name + ' says woof!')\n```"
        };
        lessonContent.innerHTML = `<div class='whitespace-pre-wrap'>${marked.parse(lessons[topic])}</div>`;
        lessonContent.classList.remove('hidden');
        lessonContent.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      window.askGPT = async function() {
        const prompt = document.getElementById('prompt').value;
        const res = await fetch('/api/gpt-python', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        responseEl.innerHTML = renderCodeBlock(data.response);
        choicesEl.classList.add('hidden');
        nextBtn.classList.add('hidden');
      }

      window.startLesson = async function () {
        hasGuessedWrong = false;
        nextBtn.classList.add("hidden");

        const difficulty = document.getElementById('difficulty').value;
        const promptText = `
You are a Python tutor. Generate a multiple choice question that includes real Python code that must be evaluated.

Mix up the question types. Use different phrasings such as:
- What does this code print?
- What is the value of ... after execution?
- What does this function return?
- Which line will cause an error?
- What type is the result of this expression?

Return ONLY raw JSON in this format:
{
  "question": "<the full Python question INCLUDING code>",
  "options": ["A. ...", "B. ...", "C. ...", "D. ..."],
  "answer": "B. ..."
}

Rules:
- Include real Python code (use \`print(...)\`, variables, logic, etc)
- Vary the type of reasoning: logic, scope, functions, errors, expressions
- The question MUST include a code snippet
- Output only valid JSON. No markdown. No explanations.
- Ensure the correct answer is accurate.
(Difficulty: ${difficulty.toUpperCase()})`

        const res = await fetch("/api/gpt-python", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          const difficulty = document.getElementById('difficulty').value;
        const promptText = `
You are a Python tutor. Generate a multiple choice question that includes real Python code that must be evaluated.

Mix up the question types. Use different phrasings such as:
- What does this code print?
- What is the value of ... after execution?
- What does this function return?
- Which line will cause an error?
- What type is the result of this expression?

Return ONLY raw JSON in this format:
{
  "question": "<the full Python question INCLUDING code>",
  "options": ["A. ...", "B. ...", "C. ...", "D. ..."],
  "answer": "B. ..."
}

Rules:
- Include real Python code (use \`print(...)\`, variables, logic, etc)
- Vary the type of reasoning: logic, scope, functions, errors, expressions
- The question MUST include a code snippet
- Output only valid JSON. No markdown. No explanations.
- Ensure the correct answer is accurate.
`print(...)\`, variables, logic, etc)
- The question MUST include a code snippet
- Output only valid JSON. No markdown. No explanations.
- Ensure the correct answer is accurate.
 (Difficulty: ${difficulty.toUpperCase()})`
        }),
        });

        const data = await res.json();

        try {
          const parsed = JSON.parse(data.response);
          responseEl.innerHTML = renderCodeBlock(parsed.question);
          correctAnswer = parsed.answer;
          parsed.options.forEach((opt, i) => {
            buttons[i].textContent = opt;
            buttons[i].disabled = false;
            buttons[i].onclick = () => {
              attempts++;
              if (opt === correctAnswer) {
                if (!hasGuessedWrong) {
                  score++;
                  streak++;
                } else {
                  streak = 0;
                }
                responseEl.innerHTML = renderCodeBlock("✅ Correct!\n\n" + parsed.question);
                updateStats();
                Array.from(buttons).forEach((btn) => (btn.disabled = true));
                nextBtn.classList.remove("hidden");
              } else {
                hasGuessedWrong = true;
                streak = 0;
                responseEl.innerHTML = renderCodeBlock("❌ Incorrect. Try again.\n\n" + parsed.question);
                updateStats();
              }
            };
          });
          choicesEl.classList.remove("hidden");
        } catch (e) {
          responseEl.textContent = "⚠️ Could not parse GPT response as JSON.";
          choicesEl.classList.add("hidden");
        }
      };

      updateStats();
    });
  </script>
</body>
</html>
