<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Python Tutor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans min-h-screen flex items-center justify-center">
  <div class="w-full max-w-2xl bg-gray-900 p-6 rounded-xl shadow-xl space-y-6">
    <h1 class="text-4xl font-bold text-center text-blue-400">GPT Python Tutor</h1>
    <div id="score" class="text-center text-green-400 text-lg">Score: 0</div>

    <textarea id="prompt" placeholder="Ask a Python question..." class="w-full p-4 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4"></textarea>

    <div class="flex flex-col sm:flex-row gap-3">
      <button onclick="askGPT()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded text-lg font-semibold">
        Ask GPT
      </button>
      <button onclick="startLesson()" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 px-4 rounded text-lg font-semibold">
        Teach Me Python
      </button>
    </div>

    <div id="response" class="whitespace-pre-wrap bg-gray-800 text-sm p-4 rounded border border-gray-700 font-mono min-h-[120px] transition-all duration-300 ease-in-out"></div>

    <div id="choices" class="space-y-2 hidden">
      <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
      <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
      <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
      <button class="choice-btn w-full py-2 rounded bg-gray-700 hover:bg-gray-600"></button>
    </div>
  </div>

  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    const responseEl = document.getElementById('response');
    const choicesEl = document.getElementById('choices');
    const buttons = document.getElementsByClassName('choice-btn');
    let correctAnswer = '';

    function updateScore() {
      scoreEl.textContent = `Score: ${score}`;
    }

    async function askGPT() {
      const prompt = document.getElementById('prompt').value;
      const res = await fetch('/api/gpt-python', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      responseEl.textContent = data.response;
      choicesEl.classList.add('hidden');
    }

    async function startLesson() {
      const res = await fetch('/api/gpt-python', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: "Create a Python multiple choice question with 4 options as JSON with keys: question, options, answer."
        })
      });
      const data = await res.json();

      try {
        const parsed = JSON.parse(data.response);
        responseEl.textContent = parsed.question;
        correctAnswer = parsed.answer;
        parsed.options.forEach((opt, i) => {
          buttons[i].textContent = opt;
          buttons[i].onclick = () => {
            if (opt === correctAnswer) {
              score++;
              responseEl.textContent = '✅ Correct!\n\n' + parsed.question;
            } else {
              responseEl.textContent = `❌ Incorrect. Correct answer: ${correctAnswer}\n\n` + parsed.question;
            }
            updateScore();
          };
        });
        choicesEl.classList.remove('hidden');
      } catch (e) {
        responseEl.textContent = '⚠️ Could not parse GPT response as JSON.';
        choicesEl.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
